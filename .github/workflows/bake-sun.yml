name: Bake and verify Blender Sun
on:
  workflow_dispatch:
  push:
    branches:
      - feat/peer-presence-math-sun-20261114
    paths:
      - scripts/blender_sun.py
      - scripts/optimize-sun.mjs
      - .github/workflows/bake-sun.yml
concurrency:
  group: bake-sun-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Bake realistic Sun in Blender
        run: blender -b --python scripts/blender_sun.py
      - name: Install dependencies
        run: npm ci
      - name: Optimize solar texture
        run: node scripts/optimize-sun.mjs
      - name: Typecheck, tests and production build
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Commit tested Blender artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/sun-photosphere.blend public/images/sun-photosphere.jpg
          if ! git diff --cached --quiet; then
            git commit -m "art(blender): bake tested solar photosphere and editable scene"
            git pull --rebase origin feat/peer-presence-math-sun-20261114
            git push origin HEAD:feat/peer-presence-math-sun-20261114
          fi
